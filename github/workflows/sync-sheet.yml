name: Sync events uit Google Sheet

on:
  schedule:
    - cron: "*/15 * * * *"   # elke 15 minuten
  workflow_dispatch:          # laat toe om ook met de hand op "Run workflow" te klikken

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Haal CSV op bij Google en sla lokaal op
        env:
          # Zelfde PUBLISH_ID als in index.html (uit: Bestand > Delen > Publiceren
          # op internet > CSV). Pas hieronder aan als je ID ooit verandert.
          PUBLISH_ID: "2PACX-1vSZTCUphDDBAQRPt-UvGLAUL6U4IciVt_VtN5LRilX82u98WGAJZQh-gdbXoZAQvvmYjuSXFHDpfSgw"
        run: |
          curl -fsSL "https://docs.google.com/spreadsheets/d/e/${PUBLISH_ID}/pub?output=csv" -o events.csv.new

          # Basiscontrole: als Google per ongeluk HTML teruggeeft (bv. rechten
          # tijdelijk fout), stoppen we hier zodat we nooit een kapot bestand
          # naar de live site pushen.
          if head -c 100 events.csv.new | grep -qi "<!doctype\|<html"; then
            echo "Google gaf HTML terug in plaats van CSV — sheet niet publiek leesbaar? Actie afgebroken."
            exit 1
          fi

          mv events.csv.new events.csv

      - name: Commit en push als er iets veranderd is
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- events.csv; then
            echo "Geen wijzigingen in events.csv"
          else
            git add events.csv
            git commit -m "Sync events.csv uit Google Sheet"
            git push
          fi
